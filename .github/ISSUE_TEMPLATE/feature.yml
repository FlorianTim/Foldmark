name: Feature proposal
description: Propose a user outcome or OpenSpec change
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user need rather than only a technical solution.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: dropdown
    id: privacy
    attributes:
      label: Does this require network access or external data processing?
      options: [No, Unsure, Yes]
    validations:
      required: true
  - type: textarea
    id: formats
    attributes:
      label: Affected document, print or export formats
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
