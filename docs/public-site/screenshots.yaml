# Screenshots the documentation may reference.
#
# The capturing spec (tests/e2e/screenshots.spec.ts) writes the files; this
# manifest declares which of them the guides and the FAQ are allowed to point
# at, and what they show.
#
# A guide referencing an id missing here fails the render. An id declared
# here whose image is missing fails too, unless it is marked `optional`.
#
# Captions double as image alt text on the published site and as the plain
# text that replaces the image in the bundled in-app help — `parseMarkdown`
# deliberately does not resolve images. Describe the screen, do not repeat
# the file name.

schemaVersion: 1

shots:
  - id: 01-intro
    caption:
      de: Die Einleitung beim ersten Besuch
      en: The first-visit intro
  - id: 02-settings
    caption:
      de: Die Einstellungen in Kategorien, mit Sprache und Einleitung unter „Allgemein“
      en: The settings in categories, with language and intro under “General”
  - id: 03-privacy
    caption:
      de: Datenschutz und Daten mit Bestandsanzeige, Sicherung und Gefahrenbereich
      en: Privacy and data, showing the inventory, the backup and the danger zone
  - id: 04-workspace
    caption:
      de: Arbeitsbereich mit Dokumenteinstellungen, Schreibbereich und Papiervorschau
      en: The workspace with document settings, writing area and paper preview
  - id: 05-profiles
    caption:
      de: Ein Druckprofil mit allen Markenkoordinaten in Millimetern
      en: A print profile with every marker coordinate in millimetres
  - id: 06-documents
    caption:
      de: Der Arbeitsbereich als Dateimanager mit Ordnern, Typen und Status
      en: The workspace as a file manager with folders, types and status
  - id: 07-contacts
    caption:
      de: Das Kontaktverzeichnis, alphabetisch gruppiert, mit Suche
      en: The contact directory, grouped alphabetically, with search
